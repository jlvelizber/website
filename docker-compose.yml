services:
  site:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://jorgeveliz.dev}
    image: marca-personal-fullstack:prod
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: ${DOMAIN:-jorgeveliz.dev},www.${DOMAIN:-jorgeveliz.dev}
      LETSENCRYPT_HOST: ${DOMAIN:-jorgeveliz.dev},www.${DOMAIN:-jorgeveliz.dev}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@jorgeveliz.dev}
      VIRTUAL_PORT: 80
    networks:
      - web

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - web

  acme-companion:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@jorgeveliz.dev}
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  web:

volumes:
  certs:
  vhost:
  html:
  acme:
