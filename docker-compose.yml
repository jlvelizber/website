services:
  site:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://jorgeveliz.dev}
    image: marca-personal-fullstack:prod
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-8080}:80"

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
