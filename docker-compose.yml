services:
  site:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://jorgeveliz.dev}
    image: marca-personal-fullstack:prod
    container_name: marca-personal-site
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy:
    name: ${CADDY_NETWORK:-proxy}
    external: true
