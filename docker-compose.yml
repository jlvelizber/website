services:
  site:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://jorgeveliz.dev}
    image: marca-personal-fullstack:prod
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - site
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-jorgeveliz.dev}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@jorgeveliz.dev}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
